name: Check plugins

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The registry is checked with the same validator panels use
      - uses: actions/checkout@v4
        with:
          repository: MRegterschot/gocontrolpanel
          ref: ${{ vars.TMCONTROLPANEL_REF || 'release' }}
          path: .controlpanel

      - uses: oven-sh/setup-bun@v2

      - name: Install the plugin SDK
        working-directory: .controlpanel
        run: bun install --frozen-lockfile

      - name: Generate the database client for the sandbox test harness
        working-directory: .controlpanel
        run: DB=mysql bun run generate

      - name: Link registry tooling to the SDK checkout
        run: bun run setup

      - name: Typecheck and test first-party plugins
        run: bun run typecheck && bun run test

      - name: Verify first-party source matches published packages
        run: bun run build

      - name: Check every plugin and version
        working-directory: .controlpanel
        run: bun packages/plugin-sdk/src/cli/main.ts registry --registry "$GITHUB_WORKSPACE" --check
